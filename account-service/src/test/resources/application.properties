# H2 replaces MySQL ? no external DB needed for tests
spring.datasource.url=jdbc:h2:mem:accounttestdb;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Disable Eureka ? tests don't need service registration
eureka.client.enabled=false

# Disable config server ? tests use this file directly
spring.cloud.config.enabled=false
spring.config.import=optional:configserver:

# Disable Kafka auto-configuration ? we mock Kafka in unit tests
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration

