server.port=8080

# ?? Eureka ????????????????????????????????????????????????????????????????
# Gateway registers with Eureka AND uses it to resolve lb:// routes.
# Both client and server-side discovery in one service.
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

# ?? Redis ????????????????????????????????????????????????????????????????
# Reactive Redis for rate limiting.
spring.data.redis.host=localhost
spring.data.redis.port=6379

# ?? JWT ???????????????????????????????????????????????????????????????????
# Must be identical to user-service jwt.secret.
# If these differ, Gateway cannot validate tokens that user-service issued.
jwt.secret=smartBankingPlatformSecretKey2025ThisIsLongEnoughForHS256Algorithm

# ?? Routes ????????????????????????????????????????????????????????????????
# PUBLIC routes ? no authentication filter applied
# user-service: register and login
spring.cloud.gateway.routes[0].id=user-service-public
spring.cloud.gateway.routes[0].uri=lb://user-service
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/auth/register,/api/auth/login
spring.cloud.gateway.routes[0].filters[0]=StripPrefix=0

# PROTECTED routes ? AuthenticationFilter validates JWT
# user-service: logout and profile
spring.cloud.gateway.routes[1].id=user-service-protected
spring.cloud.gateway.routes[1].uri=lb://user-service
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/auth/**,/api/auth/users/**
spring.cloud.gateway.routes[1].filters[0]=AuthenticationFilter
spring.cloud.gateway.routes[1].filters[1]=StripPrefix=0

# account-service
spring.cloud.gateway.routes[2].id=account-service
spring.cloud.gateway.routes[2].uri=lb://account-service
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/accounts/**
spring.cloud.gateway.routes[2].filters[0]=AuthenticationFilter
spring.cloud.gateway.routes[2].filters[1]=StripPrefix=0

# transaction-service ? also rate limited
spring.cloud.gateway.routes[3].id=transaction-service
spring.cloud.gateway.routes[3].uri=lb://transaction-service
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/transactions/**
spring.cloud.gateway.routes[3].filters[0]=AuthenticationFilter
spring.cloud.gateway.routes[3].filters[1]=StripPrefix=0

# fraud-detection-service
spring.cloud.gateway.routes[4].id=fraud-detection-service
spring.cloud.gateway.routes[4].uri=lb://fraud-detection-service
spring.cloud.gateway.routes[4].predicates[0]=Path=/api/fraud/**
spring.cloud.gateway.routes[4].filters[0]=AuthenticationFilter
spring.cloud.gateway.routes[4].filters[1]=StripPrefix=0

# notification-service
spring.cloud.gateway.routes[5].id=notification-service
spring.cloud.gateway.routes[5].uri=lb://notification-service
spring.cloud.gateway.routes[5].predicates[0]=Path=/api/notifications/**
spring.cloud.gateway.routes[5].filters[0]=AuthenticationFilter
spring.cloud.gateway.routes[5].filters[1]=StripPrefix=0

# ?? Rate Limiter ???????????????????????????????????????????????????????????
# replenish-rate: tokens added to bucket per second per user
# burst-capacity: max tokens a user can accumulate (allows short bursts)
# request-rate-limiter.include-headers: adds rate limit headers to response
spring.cloud.gateway.default-filters[0].name=RequestRateLimiter
spring.cloud.gateway.default-filters[0].args.key-resolver=#{@userUuidKeyResolver}
spring.cloud.gateway.default-filters[0].args.redis-rate-limiter.replenish-rate=10
spring.cloud.gateway.default-filters[0].args.redis-rate-limiter.burst-capacity=20
spring.cloud.gateway.default-filters[0].args.redis-rate-limiter.requested-tokens=1
# ?? Actuator ?????????????????????????????????????????????????????????????
# /actuator/gateway/routes shows all configured routes ? useful for debugging
management.endpoints.web.exposure.include=health,info,gateway
management.endpoint.gateway.enabled=true

# ?? Logging ??????????????????????????????????????????????????????????????
logging.level.org.springframework.cloud.gateway=DEBUG
logging.level.com.smartbanking=DEBUG