server.port=8084

# fraud-detection-service owns fraud_db ? separate from all other databases
spring.datasource.url=jdbc:mysql://localhost:3306/fraud_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Kafka producer ? publishes FraudResultEvent and FraudAlertEvent
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=true

# Kafka consumer ? consumes TransactionInitiatedEvent
spring.kafka.consumer.group-id=fraud-detection-group
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.smartbanking.common.event
spring.kafka.consumer.properties.spring.json.use.type.headers=true
# auto-offset-reset=earliest means: on first startup, read from beginning of topic
# This ensures we never miss events that arrived before this service started
spring.kafka.consumer.auto-offset-reset=earliest

# Redis ? velocity counters
spring.data.redis.host=localhost
spring.data.redis.port=6379

# Fraud business rules ? tunable without code changes
# Changing these values only requires config-server file update + service restart
fraud.rules.max-amount-threshold=100000
fraud.rules.max-transactions-per-minute=5
fraud.rules.max-same-destination-per-hour=3
fraud.rules.high-risk-score-threshold=70
fraud.rules.medium-risk-score-threshold=40
fraud.rules.unusual-hour-start=1
fraud.rules.unusual-hour-end=5