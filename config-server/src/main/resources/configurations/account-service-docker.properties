# ================================================================
# account-service-docker.properties
# Place this file at:
#   config-server/src/main/resources/configurations/account-service-docker.properties
#
# This is loaded ON TOP of account-service.properties when the
# account-service container starts with SPRING_PROFILES_ACTIVE=docker.
# Spring Cloud Config automatically layers <app>-<profile>.properties
# over <app>.properties for native search-locations.
#
# Only the values that change between host machine and docker network
# are listed here — everything else is inherited unchanged.
# ================================================================

spring.datasource.url=jdbc:mysql://mysql:3306/account_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true

spring.kafka.bootstrap-servers=kafka:9092

eureka.client.service-url.defaultZone=http://service-registry:8761/eureka/
