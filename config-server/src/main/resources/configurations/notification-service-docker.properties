# ================================================================
# notification-service-docker.properties
# Place at: config-server/src/main/resources/configurations/notification-service-docker.properties
# Layered on top of notification-service.properties when profile=docker.
# ================================================================

spring.datasource.url=jdbc:mysql://mysql:3306/notification_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true

spring.kafka.bootstrap-servers=kafka:9092

eureka.client.service-url.defaultZone=http://service-registry:8761/eureka/

# Mailtrap/SMTP password — DO NOT hardcode in committed files.
# Set via environment variable in docker-compose.yml (notification-service.environment),
# which Spring will inject as spring.mail.password automatically.
