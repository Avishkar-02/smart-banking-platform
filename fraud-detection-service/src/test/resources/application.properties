# H2 replaces MySQL for tests
spring.datasource.url=jdbc:h2:mem:fraudtestdb;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Disable Eureka ? not needed in tests
eureka.client.enabled=false

# Disable config server ? use this properties file directly
spring.cloud.config.enabled=false
spring.config.import=optional:configserver:

# Exclude Kafka auto-configuration ? Kafka is mocked in unit tests
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration

# Redis ? mocked in unit tests
spring.data.redis.host=localhost
spring.data.redis.port=6379

# Fraud rules ? same as production for test consistency
fraud.rules.max-amount-threshold=100000
fraud.rules.max-transactions-per-minute=5
fraud.rules.max-same-destination-per-hour=3
fraud.rules.high-risk-score-threshold=70
fraud.rules.medium-risk-score-threshold=40
fraud.rules.unusual-hour-start=1
fraud.rules.unusual-hour-end=5