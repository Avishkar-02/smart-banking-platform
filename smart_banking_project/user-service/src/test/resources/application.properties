# H2 replaces MySQL in tests ? no external DB needed
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Disable Eureka ? tests don't need service registration
eureka.client.enabled=false

# Disable config server ? tests use this file directly
spring.cloud.config.enabled=false
spring.config.import=optional:configserver:

# JWT test values
jwt.secret=testSecretKeyForJwtThatIsLongEnoughForHMACSHA256Algorithm
jwt.expiration=3600000
jwt.refresh-expiration=604800000

# Exclude Kafka auto-configuration ? we mock Kafka in tests
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration

# Redis ? mocked in unit tests
spring.data.redis.host=localhost
spring.data.redis.port=6379