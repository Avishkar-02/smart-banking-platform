# H2 replaces MySQL
spring.datasource.url=jdbc:h2:mem:txntestdb;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Disable Eureka in tests
eureka.client.enabled=false

# Disable config server in tests
spring.cloud.config.enabled=false
spring.config.import=optional:configserver:

# Disable Kafka ? mocked in unit tests
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration

# Redis ? mocked in unit tests
spring.data.redis.host=localhost
spring.data.redis.port=6379

# Resilience4j ? keep default for tests (no external dependencies)
resilience4j.circuitbreaker.instances.fraud-service.sliding-window-size=10
resilience4j.circuitbreaker.instances.fraud-service.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.fraud-service.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.fraud-service.permitted-number-of-calls-in-half-open-state=3