# ================================================================
# application-docker.properties — config-server
# Place this file at: config-server/src/main/resources/application-docker.properties
#
# Activated via SPRING_PROFILES_ACTIVE=docker (set in docker-compose.yml).
# Overrides ONLY the values that differ between localhost and docker network.
# Everything else (server.port, native search-locations) stays the same
# because config-server doesn't depend on other services at startup.
# ================================================================

# 'native' profile is still needed (don't remove it) - combine via comma in compose env var.
# Eureka is reached by its container/service name on the docker network, not localhost.
eureka.client.service-url.defaultZone=http://service-registry:8761/eureka/
