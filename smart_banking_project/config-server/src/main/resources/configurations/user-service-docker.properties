# ================================================================
# user-service-docker.properties
# Place at: config-server/src/main/resources/configurations/user-service-docker.properties
# Layered on top of user-service.properties when profile=docker.
# ================================================================

spring.datasource.url=jdbc:mysql://mysql:3306/user_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true

spring.kafka.bootstrap-servers=kafka:9092

spring.data.redis.host=redis
spring.data.redis.port=6379

eureka.client.service-url.defaultZone=http://service-registry:8761/eureka/
