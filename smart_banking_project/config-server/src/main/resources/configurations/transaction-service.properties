server.port=8083

spring.datasource.url=jdbc:mysql://localhost:3306/transaction_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=true

spring.kafka.consumer.group-id=transaction-service-group
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.smartbanking.common.event
spring.kafka.consumer.properties.spring.json.use.type.headers=true

spring.data.redis.host=localhost
spring.data.redis.port=6379

resilience4j.circuitbreaker.instances.fraud-service.sliding-window-size=10
resilience4j.circuitbreaker.instances.fraud-service.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.fraud-service.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.fraud-service.permitted-number-of-calls-in-half-open-state=3