spring.datasource.url=jdbc:h2:mem:notiftestdb;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

eureka.client.enabled=false
spring.cloud.config.enabled=false
spring.config.import=optional:configserver:

# Exclude Kafka and Mail from auto-configuration in tests
# Both are mocked manually
spring.autoconfigure.exclude=\
  org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration,\
  org.springframework.boot.autoconfigure.mail.MailSenderAutoConfiguration

notification.mail.from=noreply@smartbanking.com
notification.mail.from-name=Smart Banking Platform