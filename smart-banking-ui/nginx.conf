server {
    listen 80;
    server_name localhost;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        # Tries to match the file or folder requested; falls back to index.html for React Router
        try_files $uri $uri/ /index.html;
    }

    # Optional: Cache control for static assets to improve loading times
    location /static/ {
        root /usr/share/nginx/html;
        expires max;
        add_header Cache-Control "public, no-transform";
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}