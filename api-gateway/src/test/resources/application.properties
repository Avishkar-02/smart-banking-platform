# Disable Eureka in tests
eureka.client.enabled=false

# Disable config server in tests
spring.cloud.config.enabled=false
spring.config.import=optional:configserver:

# JWT secret for tests ? same length as production
jwt.secret=testSecretKeyForJwtThatIsLongEnoughForHMACSHA256Algorithm

# Disable Redis auto-configuration ? mocked in tests
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.data.redis.ReactiveRedisAutoConfiguration,org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration

spring.application.name=api-gateway